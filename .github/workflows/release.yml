name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Run tests
      run: go test -v ./...

    - name: Build multiplatform binaries
      run: |
        make build-all
        ls -lah release/

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release/*
        body: |
          Changes in this Release:
          - See CHANGELOG.md for details
          
          ## Downloads
          - Linux (amd64/arm64)
          - macOS (amd64/arm64)  
          - Windows (amd64/arm64)

    - name: Build Docker image
      run: |
        docker build -f docker/Dockerfile -t message-mirror:${{ github.ref_name }} .
        docker build -f docker/Dockerfile -t message-mirror:latest .

    - name: Push to Registry
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      run: |
        echo "Docker push would happen here"
        echo "Currently configured for: ghcr.io/message-mirror:${{ github.ref_name }}"
