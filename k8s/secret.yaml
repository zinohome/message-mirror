apiVersion: v1
kind: Secret
metadata:
  name: message-mirror-secret
  namespace: message-mirror
  labels:
    app: message-mirror
type: Opaque
stringData:
  # 源Kafka认证信息
  source-sasl-username: ""
  source-sasl-password: ""
  
  # 目标Kafka认证信息
  target-sasl-username: ""
  target-sasl-password: ""
  
  # TLS证书（如果需要）
  # ca.crt: |
  #   -----BEGIN CERTIFICATE-----
  #   ...
  #   -----END CERTIFICATE-----
  # client.crt: |
  #   -----BEGIN CERTIFICATE-----
  #   ...
  #   -----END CERTIFICATE-----
  # client.key: |
  #   -----BEGIN PRIVATE KEY-----
  #   ...
  #   -----END PRIVATE KEY-----
