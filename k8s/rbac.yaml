apiVersion: v1
kind: ServiceAccount
metadata:
  name: message-mirror
  namespace: message-mirror
  labels:
    app: message-mirror
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: message-mirror
  namespace: message-mirror
  labels:
    app: message-mirror
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: message-mirror
  namespace: message-mirror
  labels:
    app: message-mirror
subjects:
- kind: ServiceAccount
  name: message-mirror
  namespace: message-mirror
roleRef:
  kind: Role
  name: message-mirror
  apiGroup: rbac.authorization.k8s.io
