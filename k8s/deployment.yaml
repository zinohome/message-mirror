apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-mirror
  namespace: message-mirror
  labels:
    app: message-mirror
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: message-mirror
  template:
    metadata:
      labels:
        app: message-mirror
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # 使用ServiceAccount
      serviceAccountName: message-mirror
      
      # 安全上下文
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      # 初始化容器（可选：等待Kafka就绪）
      initContainers:
      - name: wait-for-kafka
        image: busybox:1.36
        command: 
        - sh
        - -c
        - |
          echo "等待Kafka就绪..."
          until nc -zv ${SOURCE_KAFKA_HOST} ${SOURCE_KAFKA_PORT}; do
            echo "Kafka未就绪，等待5秒..."
            sleep 5
          done
          echo "Kafka已就绪！"
        env:
        - name: SOURCE_KAFKA_HOST
          value: "kafka.kafka.svc.cluster.local"
        - name: SOURCE_KAFKA_PORT
          value: "9092"
      
      containers:
      - name: message-mirror
        image: message-mirror:latest
        imagePullPolicy: IfNotPresent
        
        # 资源限制
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        
        # 端口配置
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        
        # 环境变量
        env:
        # 配置文件路径
        - name: CONFIG_PATH
          value: /app/config/config.yaml
        
        # 源Kafka配置
        - name: SOURCE_KAFKA_BROKERS
          value: "kafka.kafka.svc.cluster.local:9092"
        - name: SOURCE_TOPIC
          value: "source-topic"
        - name: CONSUMER_GROUP_ID
          value: "message-mirror-group"
        - name: SOURCE_SECURITY_PROTOCOL
          value: "PLAINTEXT"
        - name: SOURCE_SASL_USERNAME
          valueFrom:
            secretKeyRef:
              name: message-mirror-secret
              key: source-sasl-username
              optional: true
        - name: SOURCE_SASL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: message-mirror-secret
              key: source-sasl-password
              optional: true
        
        # 目标Kafka配置
        - name: TARGET_KAFKA_BROKERS
          value: "kafka.kafka.svc.cluster.local:9092"
        - name: TARGET_TOPIC
          value: "target-topic"
        - name: TARGET_SECURITY_PROTOCOL
          value: "PLAINTEXT"
        - name: TARGET_SASL_USERNAME
          valueFrom:
            secretKeyRef:
              name: message-mirror-secret
              key: target-sasl-username
              optional: true
        - name: TARGET_SASL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: message-mirror-secret
              key: target-sasl-password
              optional: true
        
        # Mirror配置
        - name: WORKER_COUNT
          value: "4"
        - name: CONSUMER_RATE_LIMIT
          value: "0"
        - name: PRODUCER_RATE_LIMIT
          value: "0"
        - name: BYTES_RATE_LIMIT
          value: "10485760"  # 10MB/s
        - name: BATCH_ENABLED
          value: "true"
        - name: BATCH_SIZE
          value: "100"
        - name: COMPRESSION_TYPE
          value: "snappy"
        
        # 重试和去重配置
        - name: RETRY_ENABLED
          value: "true"
        - name: RETRY_MAX_RETRIES
          value: "3"
        - name: DEDUP_ENABLED
          value: "false"
        
        # 存储卷挂载
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: logs
          mountPath: /app/logs
        - name: data
          mountPath: /app/data
        
        # 健康检查
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        
        # 启动探针
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        
        # 优雅终止
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]
      
      # 存储卷定义
      volumes:
      - name: config
        configMap:
          name: message-mirror-config
      - name: logs
        emptyDir: {}
      - name: data
        emptyDir: {}
      
      # Pod优雅终止时间
      terminationGracePeriodSeconds: 30
      
      # 调度策略：避免部署到同一节点
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - message-mirror
              topologyKey: kubernetes.io/hostname
